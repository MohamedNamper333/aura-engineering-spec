openapi: 3.1.0
info:
  title: AURA API
  version: 1.0.0
  description: Machine-readable API contract baseline.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
      responses: { '201': { description: Registered user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /auth/login:
    post:
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses: { '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/logout:
    post:
      operationId: logoutUser
      responses: { '204': { description: Session revoked }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/recovery/request:
    post:
      operationId: requestAccountRecovery
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequest' } } }
      responses: { '202': { description: Recovery request accepted } }
  /auth/recovery/confirm:
    post:
      operationId: confirmAccountRecovery
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryConfirmRequest' } } }
      responses: { '204': { description: Recovery completed }, '400': { $ref: '#/components/responses/ValidationError' } }
  /me:
    get:
      operationId: getCurrentUser
      responses: { '200': { description: Current authenticated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /sections:
    get:
      operationId: listSections
      security: []
      responses: { '200': { description: Vocational sections, content: { application/json: { schema: { $ref: '#/components/schemas/SectionList' } } } } }
  /subjects/{subject_id}:
    get:
      operationId: getSubject
      security: []
      parameters: [{ $ref: '#/components/parameters/SubjectId' }]
      responses: { '200': { description: Subject, content: { application/json: { schema: { $ref: '#/components/schemas/Subject' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /courses/{course_id}:
    get:
      operationId: getCourse
      security: []
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      responses: { '200': { description: Course, content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /courses/{course_id}/lectures:
    get:
      operationId: listCourseLectures
      security: []
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      responses: { '200': { description: Course lectures, content: { application/json: { schema: { $ref: '#/components/schemas/LectureList' } } } } }
  /lectures/{lecture_id}:
    get:
      operationId: getLecture
      parameters: [{ $ref: '#/components/parameters/LectureId' }]
      responses: { '200': { description: Lecture, content: { application/json: { schema: { $ref: '#/components/schemas/Lecture' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /lectures/{lecture_id}/progress:
    post:
      operationId: updateLectureProgress
      parameters: [{ $ref: '#/components/parameters/LectureId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProgressUpdate' } } }
      responses: { '200': { description: Updated progress, content: { application/json: { schema: { $ref: '#/components/schemas/Progress' } } } } }
  /quizzes/{quiz_id}/attempts:
    post:
      operationId: submitQuizAttempt
      parameters: [{ $ref: '#/components/parameters/QuizId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuizAttemptRequest' } } }
      responses: { '201': { description: Quiz attempt, content: { application/json: { schema: { $ref: '#/components/schemas/QuizAttempt' } } } } }
  /me/learning/progress:
    get:
      operationId: getMyLearningProgress
      responses: { '200': { description: Learning progress, content: { application/json: { schema: { $ref: '#/components/schemas/LearningProgress' } } } } }
  /orders:
    post:
      operationId: createOrder
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderRequest' } } }
      responses: { '201': { description: Order created, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /orders/{order_id}:
    get:
      operationId: getOrder
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses: { '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /orders/{order_id}/cancel:
    post:
      operationId: cancelOrder
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Cancelled order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /payments:
    post:
      operationId: createPayment
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePaymentRequest' } } }
      responses: { '201': { description: Payment initiated, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /payments/{payment_id}:
    get:
      operationId: getPayment
      parameters: [{ $ref: '#/components/parameters/PaymentId' }]
      responses: { '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /refunds:
    post:
      operationId: createRefund
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRefundRequest' } } }
      responses: { '201': { description: Refund created, content: { application/json: { schema: { $ref: '#/components/schemas/Refund' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /me/entitlements:
    get:
      operationId: listMyEntitlements
      responses: { '200': { description: Current entitlements, content: { application/json: { schema: { $ref: '#/components/schemas/EntitlementList' } } } } }
  /content/{content_id}/access:
    get:
      operationId: getContentAccess
      parameters: [{ $ref: '#/components/parameters/ContentId' }]
      responses: { '200': { description: Content access decision, content: { application/json: { schema: { $ref: '#/components/schemas/ContentAccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /activation-codes/redeem:
    post:
      operationId: redeemActivationCode
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RedeemCodeRequest' } } }
      responses: { '200': { description: Redemption result, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /me/activation-redemptions:
    get:
      operationId: listMyActivationRedemptions
      responses: { '200': { description: Activation redemptions, content: { application/json: { schema: { $ref: '#/components/schemas/ActivationRedemptionList' } } } } }
  /webhooks/{provider}:
    post:
      operationId: receiveProviderWebhook
      security: []
      parameters: [{ $ref: '#/components/parameters/Provider' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses: { '202': { description: Accepted after authenticity and replay checks }, '400': { $ref: '#/components/responses/ValidationError' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 255 } }
    SubjectId: { name: subject_id, in: path, required: true, schema: { type: string } }
    CourseId: { name: course_id, in: path, required: true, schema: { type: string } }
    LectureId: { name: lecture_id, in: path, required: true, schema: { type: string } }
    QuizId: { name: quiz_id, in: path, required: true, schema: { type: string } }
    OrderId: { name: order_id, in: path, required: true, schema: { type: string } }
    PaymentId: { name: payment_id, in: path, required: true, schema: { type: string } }
    ContentId: { name: content_id, in: path, required: true, schema: { type: string } }
    Provider: { name: provider, in: path, required: true, schema: { type: string, minLength: 1 } }
  responses:
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Not authorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: State or idempotency conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties: { code: { type: string }, message: { type: string }, request_id: { type: string }, details: { type: object, additionalProperties: true } }
    User:
      type: object
      required: [id, phone, status]
      properties: { id: { type: string }, phone: { type: string }, status: { type: string, enum: [active, suspended, deactivated] } }
    RegisterRequest:
      type: object
      required: [phone, password]
      properties: { phone: { type: string, minLength: 7 }, password: { type: string, minLength: 8, writeOnly: true } }
    LoginRequest:
      type: object
      required: [phone, password]
      properties: { phone: { type: string }, password: { type: string, writeOnly: true } }
    AuthSession:
      type: object
      required: [access_token, expires_at]
      properties: { access_token: { type: string, writeOnly: true }, expires_at: { type: string, format: date-time } }
    RecoveryRequest:
      type: object
      required: [phone]
      properties: { phone: { type: string } }
    RecoveryConfirmRequest:
      type: object
      required: [token, new_password]
      properties: { token: { type: string, writeOnly: true }, new_password: { type: string, minLength: 8, writeOnly: true } }
    Section:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string } }
    SectionList:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Section' } } }
    Subject:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string } }
    Course:
      type: object
      required: [id, title, status]
      properties: { id: { type: string }, title: { type: string }, status: { type: string, enum: [draft, published, archived] } }
    Lecture:
      type: object
      required: [id, course_id, title]
      properties: { id: { type: string }, course_id: { type: string }, title: { type: string } }
    LectureList:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Lecture' } } }
    ProgressUpdate:
      type: object
      required: [position_seconds]
      properties: { position_seconds: { type: integer, minimum: 0 }, completed: { type: boolean, default: false } }
    Progress:
      allOf: [{ $ref: '#/components/schemas/ProgressUpdate' }, { type: object, required: [lecture_id], properties: { lecture_id: { type: string } } }]
    LearningProgress:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Progress' } } }
    QuizAttemptRequest:
      type: object
      required: [answers]
      properties: { answers: { type: array, items: { type: object, required: [question_id, answer], properties: { question_id: { type: string }, answer: {} } } } }
    QuizAttempt:
      type: object
      required: [id, quiz_id, submitted_at]
      properties: { id: { type: string }, quiz_id: { type: string }, submitted_at: { type: string, format: date-time } }
    CreateOrderRequest:
      type: object
      required: [items]
      properties: { items: { type: array, minItems: 1, items: { type: object, required: [product_id, quantity], properties: { product_id: { type: string }, quantity: { type: integer, minimum: 1 } } } } }
    Order:
      type: object
      required: [id, status, currency, total_minor]
      properties: { id: { type: string }, status: { type: string }, currency: { type: string, pattern: '^[A-Z]{3}$' }, total_minor: { type: integer, minimum: 0 } }
    CreatePaymentRequest:
      type: object
      required: [order_id, provider]
      properties: { order_id: { type: string }, provider: { type: string } }
    Payment:
      type: object
      required: [id, order_id, status]
      properties: { id: { type: string }, order_id: { type: string }, status: { type: string } }
    CreateRefundRequest:
      type: object
      required: [payment_id, amount_minor]
      properties: { payment_id: { type: string }, amount_minor: { type: integer, minimum: 1 } }
    Refund:
      type: object
      required: [id, payment_id, status, amount_minor]
      properties: { id: { type: string }, payment_id: { type: string }, status: { type: string }, amount_minor: { type: integer, minimum: 1 } }
    Entitlement:
      type: object
      required: [id, resource_id, status]
      properties: { id: { type: string }, resource_id: { type: string }, status: { type: string, enum: [active, revoked, expired] } }
    EntitlementList:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Entitlement' } } }
    ContentAccess:
      type: object
      required: [content_id, allowed]
      properties: { content_id: { type: string }, allowed: { type: boolean } }
    RedeemCodeRequest:
      type: object
      required: [code]
      properties: { code: { type: string, minLength: 8, maxLength: 128 } }
    ActivationRedemptionList:
      type: object
      required: [data]
      properties: { data: { type: array, items: { type: object } } }
