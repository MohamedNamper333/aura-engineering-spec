openapi: 3.1.0
info:
  title: AURA API
  version: 1.0.0
  description: Initial machine-readable API contract for AURA.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /sections:
    get:
      operationId: listSections
      security: []
      responses:
        '200':
          description: Vocational sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionList'
  /courses/{course_id}:
    get:
      operationId: getCourse
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders:
    post:
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /orders/{order_id}:
    get:
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /payments:
    post:
      operationId: createPayment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/entitlements:
    get:
      operationId: listMyEntitlements
      responses:
        '200':
          description: Current entitlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementList'
  /activation-codes/redeem:
    post:
      operationId: redeemActivationCode
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemCodeRequest'
      responses:
        '200':
          description: Redemption result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        '409':
          $ref: '#/components/responses/Conflict'
  /lectures/{lecture_id}/progress:
    post:
      operationId: updateLectureProgress
      parameters:
        - $ref: '#/components/parameters/LectureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdate'
      responses:
        '200':
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
  /quizzes/{quiz_id}/attempts:
    post:
      operationId: submitQuizAttempt
      parameters:
        - name: quiz_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizAttemptRequest'
      responses:
        '201':
          description: Quiz attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttempt'
  /webhooks/{provider}:
    post:
      operationId: receiveProviderWebhook
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Accepted after authenticity and replay checks
        '400':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
    CourseId:
      name: course_id
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: string }
    LectureId:
      name: lecture_id
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: object, additionalProperties: true }
    User:
      type: object
      required: [id, phone, status]
      properties:
        id: { type: string }
        phone: { type: string }
        status: { type: string, enum: [active, suspended, deactivated] }
    Section:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    SectionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Section' }
    Course:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, published, archived] }
    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: string }
              quantity: { type: integer, minimum: 1 }
    Order:
      type: object
      required: [id, status, currency, total_minor]
      properties:
        id: { type: string }
        status: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        total_minor: { type: integer, minimum: 0 }
    CreatePaymentRequest:
      type: object
      required: [order_id, provider]
      properties:
        order_id: { type: string }
        provider: { type: string }
    Payment:
      type: object
      required: [id, order_id, status]
      properties:
        id: { type: string }
        order_id: { type: string }
        status: { type: string }
    Entitlement:
      type: object
      required: [id, resource_id, status]
      properties:
        id: { type: string }
        resource_id: { type: string }
        status: { type: string, enum: [active, revoked, expired] }
    EntitlementList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Entitlement' }
    RedeemCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 8, maxLength: 128 }
    ProgressUpdate:
      type: object
      required: [position_seconds]
      properties:
        position_seconds: { type: integer, minimum: 0 }
        completed: { type: boolean, default: false }
    Progress:
      allOf:
        - $ref: '#/components/schemas/ProgressUpdate'
        - type: object
          required: [lecture_id]
          properties:
            lecture_id: { type: string }
    QuizAttemptRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [question_id, answer]
            properties:
              question_id: { type: string }
              answer: {}
    QuizAttempt:
      type: object
      required: [id, quiz_id, submitted_at]
      properties:
        id: { type: string }
        quiz_id: { type: string }
        submitted_at: { type: string, format: date-time }
