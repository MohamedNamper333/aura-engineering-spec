name: Contract Gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON documents
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const file = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(file) : [file];
            });
          }
          const files = walk('schemas').filter(file => file.endsWith('.json'));
          if (!files.length) throw new Error('No JSON contract files found');
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(`Validated ${files.length} JSON contract files.`);
          NODE

      - name: Validate readiness
        run: node scripts/validate-readiness.mjs

      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@latest lint schemas/api/openapi.yaml

      - name: Validate SQL migration chain
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('schemas/database/migration-manifest.json', 'utf8'));
          if (manifest.engine !== 'postgresql') throw new Error('Unsupported database engine');
          if (!Array.isArray(manifest.migrations) || !manifest.migrations.length) throw new Error('Migration manifest is empty');
          for (const migration of manifest.migrations) {
            if (!fs.existsSync(migration.path)) throw new Error(`Missing migration: ${migration.path}`);
          }
          const ids = manifest.migrations.map(m => m.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate migration id');
          console.log(`Validated ${manifest.migrations.length} migration entries.`);
          NODE
